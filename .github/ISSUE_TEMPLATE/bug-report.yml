name: Bug Report
description: Report a bug or issue
title: "[BUG] "
labels: ["bug", "needs-triage"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough detail to reproduce it.

  - type: input
    id: version
    attributes:
      label: Plugin Version
      placeholder: e.g. v1.0.0 or a commit SHA
    validations:
      required: true

  - type: input
    id: swiftly-version
    attributes:
      label: SwiftlyS2 Version
      placeholder: e.g. 1.4.9
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      placeholder: What happened? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Run ...
        2. Use !nv ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Relevant Configuration
      description: Remove any sensitive information before pasting.
      render: jsonc

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste the relevant server or SwiftlyS2 log lines.
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Additional Context
      description: Maps, other plugins, client settings, screenshots, etc.
